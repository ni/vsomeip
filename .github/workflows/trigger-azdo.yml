# Queues the srd-tran-vehicle-networks someip PR pipeline in Azure DevOps for this PR's branch and mirrors its result.
name: AzDO someip PR build

on:
  pull_request:
    branches:
      # TEMP for testing; revert to ni/main before merging
      - users/ggrigory/Create_an_action_to_trigger_AzDo_pipline
    # converted_to_draft only cancels an in-progress run via concurrency; the job itself is skipped
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: azdo-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  azdo-build:
    # Fork PRs have no access to secrets and their branch is not clonable from ni/vsomeip
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AZDO_ORG_URL: https://dev.azure.com/ni
      AZDO_PROJECT: DevCentral
      AZDO_PIPELINE_ID: ${{ vars.AZDO_SOMEIP_PR_PIPELINE_ID }}
      AZDO_PAT: ${{ secrets.AZDO_PAT }}
      VSOMEIP_BRANCH: ${{ github.event.pull_request.head.ref }}
      VSOMEIP_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Queue Azure DevOps pipeline
        shell: bash
        run: |
          set -euo pipefail
          : "${AZDO_PIPELINE_ID:?Repository variable AZDO_SOMEIP_PR_PIPELINE_ID is not set}"
          : "${AZDO_PAT:?Repository secret AZDO_PAT is not set}"
          api="$AZDO_ORG_URL/$AZDO_PROJECT/_apis/pipelines/$AZDO_PIPELINE_ID/runs"

          body=$(jq -n --arg branch "$VSOMEIP_BRANCH" --arg commit "$VSOMEIP_COMMIT" '{
            resources: { repositories: { self: { refName: "refs/heads/users/ggrigory/vsomeip_PR_CI_Pipelines_and_SBOM_Generation" } } },
            templateParameters: { vsomeipBranch: $branch, vsomeipCommit: $commit }
          }')

          run=$(curl -sSf -u ":$AZDO_PAT" -H "Content-Type: application/json" \
            -X POST "$api?api-version=7.1" -d "$body")
          echo "AZDO_RUN_ID=$(jq -r '.id' <<< "$run")" >> "$GITHUB_ENV"
          echo "Azure DevOps run: $(jq -r '._links.web.href' <<< "$run")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Wait for Azure DevOps pipeline
        shell: bash
        run: |
          set -euo pipefail
          api="$AZDO_ORG_URL/$AZDO_PROJECT/_apis/pipelines/$AZDO_PIPELINE_ID/runs"

          while true; do
            sleep 60
            status=$(curl -sSf -u ":$AZDO_PAT" "$api/$AZDO_RUN_ID?api-version=7.1")
            state=$(jq -r '.state' <<< "$status")
            if [ "$state" = "completed" ]; then
              result=$(jq -r '.result' <<< "$status")
              echo "Result: $result" | tee -a "$GITHUB_STEP_SUMMARY"
              [ "$result" = "succeeded" ]
              exit $?
            fi
            echo "State: $state"
          done

      # Superseded pushes, manual cancels and timeouts would otherwise leave the AzDO run going
      - name: Cancel Azure DevOps run
        if: cancelled() && env.AZDO_RUN_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' -u ":$AZDO_PAT" -H "Content-Type: application/json" -X PATCH \
            "$AZDO_ORG_URL/$AZDO_PROJECT/_apis/build/builds/$AZDO_RUN_ID?api-version=7.1" \
            -d '{"status":"cancelling"}')
          # AzDO answers an unauthorized PAT with 203 + HTML sign-in page, so check the code explicitly
          echo "HTTP $code: $(jq -c '{id, status, result}' response.json 2>/dev/null || head -c 500 response.json)"
          [ "$code" = "200" ]
          echo "Cancelled Azure DevOps run $AZDO_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
