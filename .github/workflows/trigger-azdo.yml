name: Trigger AzDo Hello World

on:
  workflow_dispatch:
  push:
    branches:
      - users/ggrigory/Create_an_action_to_trigger_AzDo_pipline

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
      ORG: ni
      PROJECT: DevCentral
      PIPELINE_ID: 33718
    steps:
      - name: Queue pipeline run
        id: queue
        run: |
          if [ -z "$PAT" ]; then echo "PAT secret is empty!"; exit 1; fi
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" -X POST -u ":${PAT}" \
            -H "Content-Type: application/json" \
            "https://dev.azure.com/${ORG}/${PROJECT}/_apis/pipelines/${PIPELINE_ID}/runs?api-version=7.1" \
            -d '{}')
          echo "HTTP $HTTP_CODE"
          cat response.json; echo
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] || exit 1
          RUN_ID=$(jq -r '.id' response.json)
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for completion
        run: |
          URL="https://dev.azure.com/${ORG}/${PROJECT}/_apis/pipelines/${PIPELINE_ID}/runs/${{ steps.queue.outputs.run_id }}?api-version=7.1"
          for i in $(seq 1 120); do            # up to ~20 min
            RUN=$(curl -sS --fail -u ":${PAT}" "$URL")
            STATE=$(echo "$RUN" | jq -r '.state')
            RESULT=$(echo "$RUN" | jq -r '.result // empty')
            echo "state=$STATE result=$RESULT"
            if [ "$STATE" = "completed" ]; then
              [ "$RESULT" = "succeeded" ] && exit 0 || exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for run"; exit 1