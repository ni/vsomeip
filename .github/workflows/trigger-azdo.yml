# Queues the srd-tran-vehicle-networks someip PR pipeline in Azure DevOps for this PR's branch and mirrors its result.
name: AzDO someip PR build

on:
  pull_request:
    branches:
      # TEMP for testing; revert to ni/main before merging
      - users/ggrigory/Create_an_action_to_trigger_AzDo_pipline
    types: [opened, synchronize, reopened]

concurrency:
  group: azdo-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  azdo-build:
    # Fork PRs have no access to secrets and their branch is not clonable from ni/vsomeip
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      AZDO_ORG_URL: https://dev.azure.com/ni
      AZDO_PROJECT: DevCentral
      AZDO_PIPELINE_ID: ${{ vars.AZDO_SOMEIP_PR_PIPELINE_ID }}
      AZDO_PAT: ${{ secrets.AZDO_PAT }}
      VSOMEIP_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Queue and wait for Azure DevOps pipeline
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$AZDO_PIPELINE_ID" ] || { echo "::error::Repository variable AZDO_SOMEIP_PR_PIPELINE_ID is not set"; exit 1; }
          [ -n "$AZDO_PAT" ] || { echo "::error::Repository secret AZDO_PAT is not set"; exit 1; }
          api="$AZDO_ORG_URL/$AZDO_PROJECT/_apis/pipelines/$AZDO_PIPELINE_ID/runs"

          azdo() {
            local code
            code=$(curl -sS -o response.json -w '%{http_code}' -u ":$AZDO_PAT" -H "Content-Type: application/json" "$@")
            if [ "$code" != "200" ]; then
              echo "::error::Azure DevOps returned HTTP $code for $*" >&2
              cat response.json >&2
              return 1
            fi
            cat response.json
          }

          body=$(jq -n --arg branch "$VSOMEIP_BRANCH" '{
            resources: { repositories: { self: { refName: "refs/heads/users/bsziksza/testPipeline" } } },
            templateParameters: { vsomeipBranch: $branch }
          }')

          run=$(azdo -X POST "$api?api-version=7.1" -d "$body")
          run_id=$(jq -r '.id' <<< "$run")
          echo "Azure DevOps run: $(jq -r '._links.web.href' <<< "$run")" | tee -a "$GITHUB_STEP_SUMMARY"

          while true; do
            sleep 60
            status=$(azdo "$api/$run_id?api-version=7.1")
            state=$(jq -r '.state' <<< "$status")
            if [ "$state" = "completed" ]; then
              result=$(jq -r '.result' <<< "$status")
              echo "Result: $result" | tee -a "$GITHUB_STEP_SUMMARY"
              [ "$result" = "succeeded" ]
              exit $?
            fi
            echo "State: $state"
          done